# Personal Memory Hub — CI Pipeline
#
# Per 11_Implementation_Roadmap.md §8 (CI Strategy):
# - Stage 1: Static Analysis (ruff lint, mypy type-check)
# - Stage 2: Unit Tests (pytest with in-memory SQLite)
# - Stage 3: Integration tests — deferred to D2+
# - Stage 4: Architecture tests — deferred to D2+
# - Stage 5: Behavioral tests — deferred to D2+
# - Stage 6: Build verification — deferred to D2+
# - CD pipeline — intentionally deferred (CI over CD)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =========================================================================
  # Stage 1: Static Analysis — Ruff Linting
  # =========================================================================
  ruff-lint:
    name: Ruff Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.32"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras

      - name: Run ruff (linting)
        working-directory: backend
        id: ruff-check
        run: |
          uv run ruff check src/ tests/ --output-format=concise | sed 's|\\\\|/|g' | grep -E "^src" > current_raw.txt
          grep -E "^src" ../.hermes/plans/ci-baseline-ruff-snapshot.txt > baseline_raw.txt
          current_count=$(wc -l < current_raw.txt | tr -d ' ')
          baseline_count=$(wc -l < baseline_raw.txt | tr -d ' ')
          echo "Current src errors: $current_count"
          echo "Baseline src errors: $baseline_count"
          if [ "$current_count" -gt "$baseline_count" ]; then
            echo "ERROR: New Ruff debt detected (current $current_count > baseline $baseline_count)"
            echo "New errors (set difference):"
            sort current_raw.txt > current.txt
            sort baseline_raw.txt > baseline.txt
            comm -13 baseline.txt current.txt
            exit 1
          fi
          echo "No new Ruff debt (Legacy Baseline: current $current_count <= baseline $baseline_count)"

      - name: Upload Ruff diagnostic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics-py${{ matrix.python-version }}
          path: |
            backend/current_raw.txt
            backend/baseline_raw.txt
            backend/current.txt
            backend/baseline.txt
          retention-days: 7

  # =========================================================================
  # Stage 1: Static Analysis — MyPy Type Checking
  # =========================================================================
  mypy-typecheck:
    name: MyPy Type Checking
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.32"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras

      - name: Run mypy (type checking)
        working-directory: backend
        id: mypy-check
        run: |
          uv run mypy src/ --show-error-codes --show-column-numbers --no-pretty 2>&1 | tee mypy_output.txt
          exit_code=${PIPESTATUS[0]}
          exit $exit_code

      - name: Upload MyPy diagnostic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-diagnostics-py${{ matrix.python-version }}
          path: backend/mypy_output.txt
          retention-days: 7

  # =========================================================================
  # Stage 2: Unit Tests
  # =========================================================================
  unit-tests:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.32"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras

      - name: Run tests
        working-directory: backend
        id: pytest-run
        env:
          LOG_DIR: ${{ runner.temp }}/logs
        run: |
          uv run pytest tests/ -v --tb=long --maxfail=3 --durations=10 --cov=backend --cov-report=term-missing 2>&1 | tee pytest_output.txt
          exit_code=${PIPESTATUS[0]}
          exit $exit_code

      - name: Upload pytest diagnostic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-py${{ matrix.python-version }}
          path: backend/pytest_output.txt
          retention-days: 7

      - name: Upload coverage (non-blocking)
        working-directory: backend
        run: uv run coverage xml || true
        continue-on-error: true

  # =========================================================================
  # Build Verification (D1: lightweight)
  # =========================================================================
  build:
    name: Build verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.32"

      - name: Build package
        working-directory: backend
        run: uv build

      - name: Verify wheel
        working-directory: backend/dist
        run: ls -la *.whl