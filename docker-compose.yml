# Personal Memory Hub — Docker Compose
#
# Local development environment:
# - PostgreSQL 15 with pgvector extension
# - Personal Memory Hub application container
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f app    # Follow app logs
#   docker compose exec app python -m pytest  # Run tests
#   docker compose exec app alembic upgrade head  # Run migrations

services:
  # -----------------------------------------------------------------------
  # Database (PostgreSQL 15 + pgvector)
  # -----------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg15
    container_name: memory-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-memory_hub}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------------------------------------------------
  # Application
  # -----------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: memory-hub-app
    restart: unless-stopped
    environment:
      APP_NAME: personal-memory-hub
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/memory_hub}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1536}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      REFLECTION_MODEL: ${REFLECTION_MODEL:-qwen2.5:7b}
      REFLECTION_TEMPERATURE: ${REFLECTION_TEMPERATURE:-0.3}
      AUTO_APPROVE: ${AUTO_APPROVE:-true}
      AUTO_APPROVE_THRESHOLD: ${AUTO_APPROVE_THRESHOLD:-0.9}
      AUTO_APPROVE_MAX_LEVEL: ${AUTO_APPROVE_MAX_LEVEL:-3}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source for development (hot reload)
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      # Mount logs directory for dashboard log viewer
      - ./logs:/app/logs
      # Mount dashboard HTML
      - ./dashboard-main.html:/app/dashboard-main.html
    command: >-
      sh -c "/app/scripts/start.sh"

volumes:
  db_data:
    driver: local
