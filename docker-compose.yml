# Personal Memory Hub — Docker Compose
#
# Local development environment:
# - PostgreSQL 15 with pgvector extension
# - Personal Memory Hub application container
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f app    # Follow app logs
#   docker compose exec app python -m pytest  # Run tests
#   docker compose exec app alembic upgrade head  # Run migrations

services:
  # -----------------------------------------------------------------------
  # Database (PostgreSQL 15 + pgvector)
  # -----------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg15
    container_name: memory-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-memory_hub}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -----------------------------------------------------------------------
  # Application
  # -----------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memory-hub-app
    restart: unless-stopped
    environment:
      APP_NAME: personal-memory-hub
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/memory_hub}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      VECTOR_DIMENSION: ${VECTOR_DIMENSION:-1536}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount source for development (hot reload)
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        python -c \"
        import time, sys
        for i in range(30):
            try:
                import socket
                s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                s.connect(('db', 5432))
                s.close()
                break
            except ConnectionRefusedError:
                time.sleep(1)
        else:
            print('Database not ready', file=sys.stderr)
            sys.exit(1)
        \" &&
        echo 'Starting application...' &&
        python -m backend.cli
      "

volumes:
  db_data:
    driver: local
