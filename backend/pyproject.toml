[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-memory-hub"
version = "0.1.0"
description = "A document-driven long-term memory system for personal AI assistants."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "structlog>=24.0,<25.0",
    "uuid7>=0.1.0,<1.0",
    "aiosqlite>=0.20,<1.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29,<1.0",
    "psycopg2-binary>=2.9,<3.0",
]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "coverage>=7.0,<8.0",
]
dev = [
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",

]

[project.scripts]
memory-hub = "backend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

# ---- Tool Configurations ----

# Ruff (linting + auto-fix)
[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    "src/backend/app.py",
    "src/backend/cli.py",
    "src/backend/service/embedding_service.py",
    "src/scripts/recreate_tables.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    # RUF012: __mapper_args__ = {"eager_defaults": True} is SQLAlchemy declarative pattern
    "RUF012",
    # SIM108: ternary suggestions — readability preference, not a bug
    "SIM108",
    # RUF002: EN DASH in docstrings — acceptable for technical documentation
    "RUF002",
    # RUF022: __all__ grouping by category is intentional, not alphabetical
    "RUF022",
    # E402: module level import not at top — intentional in test files (sys.path.insert)
    "E402",
    # SIM105: try/except/pass is clearer than contextlib.suppress for async close
    "SIM105",
    # E501: test function signatures naturally long with type hints
    "E501",
    # N818: Domain-specific exception names (DomainInvariantViolation, DomainRuleViolation)
    #       follow domain-driven naming, not generic Error suffix convention
    "N818",
    # B024: EngineBase is an abstract base class without abstract methods —
    #        intentional: provides shared implementation, subclasses add @abstractmethod
    "B024",
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# MyPy (strict type checking)
[tool.mypy]
mypy_path = "src"
packages = ["backend"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "structlog.*"
ignore_missing_imports = true

# Exclude integration helper scripts from strict type checking
[[tool.mypy.overrides]]
module = [
    "backend.app",
    "backend.cli",
    "backend.service.embedding_service",
    "scripts.recreate_tables",
]
ignore_errors = true

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "unit: Unit tests (fast, deterministic)",
    "integration: Integration tests (cross-layer, no external deps)",
    "evaluation: Evaluation tests (non-blocking, LLM quality)",
    "slow: Tests that take longer than expected",
]

# Coverage
[tool.coverage.run]
source = ["backend"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
